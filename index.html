<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yorimichi — 寄り道</title>
    <meta name="description" content="A peaceful stylized 3D isometric countryside exploration experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@300;500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <!-- TOP AOE BANNER -->
        <header class="aoe-top-bar">
          <!-- Top Left Vitals Bar -->
          <div class="aoe-vitals-group">
            <div class="aoe-badge">
              <span class="aoe-badge-icon">🚲</span>
              <div class="aoe-badge-info">
                <span class="aoe-badge-label">TRAVEL</span>
                <span id="aoe-travel-mode" class="aoe-badge-val">ON FOOT</span>
              </div>
            </div>
            <div class="aoe-badge">
              <span class="aoe-badge-icon">🎐</span>
              <div class="aoe-badge-info">
                <span class="aoe-badge-label">CHIMES</span>
                <span id="aoe-bell-count" class="aoe-badge-val">0</span>
              </div>
            </div>
            <div class="aoe-badge">
              <span class="aoe-badge-icon">🍃</span>
              <div class="aoe-badge-info">
                <span class="aoe-badge-label">PACE</span>
                <span id="aoe-pace" class="aoe-badge-val">REST</span>
              </div>
            </div>
          </div>

          <!-- Top Center Age / District Header -->
          <div class="aoe-district-header">
            <div class="aoe-header-ornament left-crest"></div>
            <div class="aoe-header-content">
              <div class="aoe-header-title">
                <span id="aoe-district-kanji" class="aoe-kanji">寄り道</span>
                <span id="aoe-district-roman" class="aoe-roman">KAMISATO HAMLET</span>
              </div>
              <div id="aoe-district-sub" class="aoe-header-sub">
                <span class="aoe-sub-dot">✦</span> MORNING TRANQUILITY • GENTLE BREEZE <span class="aoe-sub-dot">✦</span>
              </div>
            </div>
            <div class="aoe-header-ornament right-crest"></div>
          </div>

          <!-- Top Right Controls (Time Mode, Camera Toggle & Sound) -->
          <div class="aoe-top-right">
            <button id="time-toggle" class="aoe-seal-btn" title="Toggle Day / Night Mode (N)" aria-label="Toggle Day and Night">
              <span id="time-btn-icon" style="font-size: 1.05rem;">☀️</span>
            </button>
            <button id="camera-toggle" class="aoe-seal-btn" title="Toggle Camera: Isometric / 3rd Person (V)" aria-label="Toggle Camera View">
              <span id="camera-btn-icon" style="font-size: 1.05rem;">🎥</span>
            </button>
            <button id="audio-toggle" class="aoe-seal-btn" title="Toggle Sound (Mute/Unmute)" aria-label="Toggle Sound">
              <svg class="audio-icon audio-on" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <svg class="audio-icon audio-off" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- BOTTOM HUD (AOE Travel Plaque & Diamond Minimap) -->
        <footer class="aoe-bottom-bar">
          <!-- Bottom Center Travel Plaque / Command Deck -->
          <div class="aoe-command-deck">
            <div class="aoe-deck-crest left"></div>
            <div class="aoe-deck-inner">
              <div class="aoe-deck-profile">
                <div class="aoe-profile-frame">
                  <span id="aoe-profile-icon">🚶</span>
                </div>
                <div class="aoe-profile-details">
                  <span class="aoe-profile-name" id="aoe-profile-title">TRAVELER</span>
                  <span class="aoe-profile-desc" id="aoe-profile-subtitle">Exploring the Village Path</span>
                </div>
              </div>
              <div class="aoe-actions-grid">
                <div class="aoe-action-card">
                  <kbd>WASD</kbd>
                  <span>Stroll</span>
                </div>
                <div class="aoe-action-card" id="aoe-action-bike">
                  <kbd>E / Shift</kbd>
                  <span id="aoe-bike-action-label">Bicycle</span>
                </div>
                <div class="aoe-action-card">
                  <kbd>Left-Drag</kbd>
                  <span>Pan Map</span>
                </div>
                <div class="aoe-action-card" id="aoe-action-rotate">
                  <kbd>Right-Drag / Q,R</kbd>
                  <span>Rotate 360°</span>
                </div>
                <div class="aoe-action-card" id="aoe-action-center">
                  <kbd>Space</kbd>
                  <span>Center</span>
                </div>
                <div class="aoe-action-card" id="aoe-action-cam">
                  <kbd>V</kbd>
                  <span id="aoe-cam-label">View</span>
                </div>
                <div class="aoe-action-card">
                  <kbd>Scroll</kbd>
                  <span>Zoom</span>
                </div>
              </div>
            </div>
            <div class="aoe-deck-crest right"></div>
          </div>

          <!-- Floating Recenter Button (Appears when map is panned away from player) -->
          <button id="aoe-recenter-btn" class="aoe-recenter-pill" style="display: none;">
            <span>🎯</span> Center on Player (Space)
          </button>

          <!-- Bottom Right AOE Diamond Minimap -->
          <div class="aoe-minimap-wrapper">
            <div class="aoe-diamond-bezel">
              <div class="aoe-diamond-inner" id="aoe-minimap-container">
                <!-- Live 2D Canvas is injected here -->
              </div>
              <div class="aoe-compass-needle">N</div>
            </div>
          </div>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
